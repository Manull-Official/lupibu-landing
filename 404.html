    <style>
        /* The page GitHub Pages shows for an address that does not exist. */
        body.page-404 { min-height: 100vh; display: flex; flex-direction: column; }
        body.page-404 main { flex: 1; display: flex; align-items: center; justify-content: center; padding: calc(72px + var(--space-2xl)) 0 var(--space-2xl); }
        .nf-card { max-width: 480px; margin: 0 auto; padding: 0 var(--space-lg); text-align: center; }
        .nf-code { margin-bottom: var(--space-sm); font: 800 4rem/1 var(--display); letter-spacing: -0.04em; color: var(--brand); }
        .nf-title { margin-bottom: var(--space-md); font-size: var(--text-section); color: var(--gray-800); }
        .nf-text { margin-bottom: var(--space-lg); font-size: var(--text-body); line-height: 1.6; color: var(--gray-600); }
        .nf-link { display: inline-flex; align-items: center; padding: var(--space-md) var(--space-lg); border-radius: var(--radius-full); background: var(--brand); color: var(--white); font: 800 1rem/1.3 var(--display); box-shadow: 0 4px 14px rgba(250, 124, 80, 0.35); transition: var(--transition-base); }
        .nf-link:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(250, 124, 80, 0.4); }
        .nf-link:focus-visible { outline: 3px solid var(--gray-800); outline-offset: 2px; }
    </style>
